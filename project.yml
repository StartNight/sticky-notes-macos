name: StickyNotes
options:
  bundleIdPrefix: com.shenanigans
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35"
  developmentLanguage: "en"
  knownRegions:
    - en
    - zh-Hans

targets:
  StickyNotes:
    type: application
    platform: macOS
    sources:
      - StickyNotes
    scheme:
      testTargets:
        - StickyNotesTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenanigans.sticky-notes
        PRODUCT_NAME: Sticky Notes
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_CFBundleDisplayName: "Sticky Notes"
        CODE_SIGN_ENTITLEMENTS: StickyNotes/StickyNotes.entitlements
        CODE_SIGN_IDENTITY: "StickyNotes Local Code Signing"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sticky Notes needs microphone access to record audio notes and dictation."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Sticky Notes uses speech recognition for dictation input."
      configs:
        Release:
          # Release must not carry the debugger entitlement (com.apple.security.get-task-allow).
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # QA: unit-test bundle WITHOUT host app.
  # Hosting would launch the real app, which opens the user's real SwiftData store and
  # auto-syncs with the signed-in Outlook account. Instead the needed production sources are
  # compiled directly into the test bundle. SyncEngine receives an injected auth double;
  # AuthManager tests inject in-memory keychains / mock HTTP. No real credentials/network.
  StickyNotesTests:
    type: bundle.unit-test
    platform: macOS
    scheme:
      testTargets:
        - StickyNotesTests
    sources:
      - Tests
      - StickyNotes/Models
      - StickyNotes/Services/AuthManager.swift
      - StickyNotes/Services/NoteConverter.swift
      - StickyNotes/Services/SyncEngine.swift
      - StickyNotes/Services/SyncRecoveryTypes.swift
      - StickyNotes/Services/AccountIsolationService.swift
      - StickyNotes/Services/TextEditorProxy.swift
      - StickyNotes/Utilities/ColorExtensions.swift
      - StickyNotes/Utilities/KeychainHelper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shenanigans.sticky-notes.tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
